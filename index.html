<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e5d3a3">
<title>Brain Fart</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo">☁<b>BRAIN<br><i>FART</i></b></div>
  <div><h1>Brain Fart</h1><p>Idea sparks, sketches, materials, production flow.</p></div>
</header>
<main id="screen"></main>

<template id="listTemplate">
<section class="screen list-screen">
  <div class="toolbar">
    <h2>Ideas</h2>
    <button class="paper-btn" data-action="new">+ Add New Idea</button>
  </div>
  <div id="ideasList" class="ideas-list"></div>
  <aside class="paper-panel sketch-panel">
    <div class="panel-title-row"><h3>Sketches</h3><span id="listSketchCount">0 / 0</span></div>
    <div class="sketch-frame"><img id="listSketchImg"><div id="listSketchEmpty" class="empty">Select an idea</div></div>
    <div class="two"><button class="paper-btn" data-action="prevListSketch">‹</button><button class="paper-btn" data-action="nextListSketch">›</button></div>
  </aside>
</section>
</template>

<template id="rowTemplate">
<article class="idea-row paper-panel">
  <div class="thumb"><img><span>No sketch</span></div>
  <div><h3></h3><p></p><small></small></div>
</article>
</template>

<template id="editorTemplate">
<section class="screen">
  <div class="toolbar">
    <button class="paper-btn ghost" data-action="back">‹ Back</button>
    <h2 id="editorTitle">New Idea</h2>
    <button class="paper-btn danger" data-action="delete">Delete</button>
  </div>

  <form id="ideaForm" class="editor-stack">
    <section class="paper-panel sketch-editor">
      <div class="panel-title-row"><h3>Sketch</h3><span id="editorSketchCount">0 / 0</span></div>
      <div class="canvas-wrap"><canvas id="sketchCanvas"></canvas></div>
      <div class="draw-tools icon-tools" aria-label="Sketch controls">
        <button type="button" class="paper-btn icon-btn" data-action="prevSketch" title="Previous sketch" aria-label="Previous sketch">‹</button>
        <button type="button" class="paper-btn icon-btn" data-action="nextSketch" title="Next sketch" aria-label="Next sketch">›</button>
        <button type="button" class="paper-btn icon-btn" data-action="newSketch" title="New sketch" aria-label="New sketch">＋</button>
        <button type="button" class="paper-btn icon-btn" data-action="undoSketch" title="Undo" aria-label="Undo">↶</button>
        <button type="button" class="paper-btn icon-btn" data-action="clearSketch" title="Clear sketch" aria-label="Clear sketch">⌫</button>
        <button type="button" class="paper-btn icon-btn" data-action="markMain" title="Mark as main sketch" aria-label="Mark as main sketch">★</button>
        <button type="button" class="paper-btn icon-btn danger" data-action="removeSketch" title="Remove sketch" aria-label="Remove sketch">×</button>
      </div>
      <p class="hint">Draw with your finger or mouse. Sketches auto-save.</p>
    </section>

    <label><span>Idea name</span><input id="ideaName" placeholder="Untitled idea"></label>
    <label><span>Description</span><textarea id="description" rows="5"></textarea></label>
    <label><span>Materials</span><textarea id="materials" rows="4"></textarea></label>
    <label><span>Stage</span><select id="stage"><option>Idea</option><option>Test Piece Done</option><option>In Production</option></select></label>
  </form>
</section>
</template>

<script src="app.js?v=004"></script>
</body>
</html>
