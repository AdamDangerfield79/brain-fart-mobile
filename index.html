<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e5d3a3" />
  <title>Brain Fart</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="logo-mark" aria-hidden="true">
        <div class="brain-doodle">☁</div>
        <div class="logo-text">BRAIN<br><span>FART</span></div>
      </div>
      <div>
        <h1>Brain Fart</h1>
        <p>Idea sparks, sketches, materials, production flow.</p>
      </div>
    </header>

    <main id="screen"></main>
  </div>

  <template id="listTemplate">
    <section class="screen list-screen">
      <div class="toolbar">
        <h2>Ideas</h2>
        <button class="paper-btn" data-action="new">+ Add New Idea</button>
      </div>
      <div id="ideasList" class="ideas-list"></div>
      <aside id="listSketchPanel" class="paper-panel sketch-panel">
        <div class="panel-title-row">
          <h3>Sketches</h3>
          <span id="listSketchCount">0 / 0</span>
        </div>
        <div class="sketch-frame">
          <img id="listSketchImg" alt="" />
          <div id="listSketchEmpty" class="empty-state">Select an idea</div>
        </div>
        <div class="sketch-nav">
          <button class="paper-btn" data-action="prevListSketch">‹</button>
          <button class="paper-btn" data-action="nextListSketch">›</button>
        </div>
      </aside>
    </section>
  </template>

  <template id="ideaRowTemplate">
    <article class="idea-row paper-panel">
      <div class="thumb"><img alt="" /><span>No sketch</span></div>
      <div class="idea-row-content">
        <h3></h3>
        <p></p>
        <small></small>
      </div>
    </article>
  </template>

  <template id="editorTemplate">
    <section class="screen editor-screen">
      <div class="toolbar">
        <button class="paper-btn ghost" data-action="back">‹ Back</button>
        <h2 id="editorTitle">New Idea</h2>
        <button class="paper-btn danger" data-action="delete">Delete</button>
      </div>

      <form id="ideaForm" class="editor-stack">
        <section class="paper-panel sketch-editor">
          <div class="panel-title-row">
            <h3>Sketch</h3>
            <span id="editorSketchCount">0 / 0</span>
          </div>

          <div class="draw-tools">
            <button type="button" class="paper-btn small" data-action="prevSketch">‹ Prev</button>
            <button type="button" class="paper-btn small" data-action="nextSketch">Next ›</button>
            <button type="button" class="paper-btn small" data-action="newSketch">+ New Sketch</button>
            <button type="button" class="paper-btn small" data-action="clearSketch">Clear</button>
            <button type="button" class="paper-btn small" data-action="markMain">Mark Main</button>
            <button type="button" class="paper-btn small danger" data-action="removeSketch">Remove</button>
          </div>

          <div class="canvas-wrap">
            <canvas id="sketchCanvas" aria-label="Sketch drawing area"></canvas>
          </div>
          <p class="canvas-hint">Draw with your finger or mouse. Sketches auto-save.</p>
        </section>

        <label>
          <span>Idea name</span>
          <input id="ideaName" type="text" autocomplete="off" placeholder="Untitled idea" />
        </label>

        <label>
          <span>Description</span>
          <textarea id="description" rows="5" placeholder="Describe the idea..."></textarea>
        </label>

        <label>
          <span>Materials</span>
          <textarea id="materials" rows="4" placeholder="Metals, stones, tools, notes..."></textarea>
        </label>

        <label>
          <span>Stage</span>
          <select id="stage">
            <option>Idea</option>
            <option>Test Piece Done</option>
            <option>In Production</option>
          </select>
        </label>
      </form>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
