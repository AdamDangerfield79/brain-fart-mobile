<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8fa">
  <title>Brain Fart v0.15 PINK</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=015">
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup" aria-label="Brain Fart Jewellery Ideas">
      <div class="brain-icon" aria-hidden="true">
        <svg viewBox="0 0 120 92">
          <path d="M42 75c-15 0-27-10-27-24 0-10 6-18 15-22 1-13 12-23 26-23 8 0 15 4 20 10 5-6 12-10 20-10 14 0 25 10 26 23 9 4 15 12 15 22 0 14-12 24-27 24H42z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M60 13v61M43 25c11 4 14 12 11 22M39 51c9 0 14 5 15 15M77 25c-11 4-14 12-11 22M81 51c-9 0-14 5-15 15" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
      </div>
      <h1>BRAIN <span>FART</span></h1>
      <div class="tagline"><span></span> JEWELLERY IDEAS <span></span></div>
      <div class="heart">♥</div>
    </div>
  </header>

  <main id="screen"></main>

  <template id="listTemplate">
    <section class="screen list-screen">
      <div class="toolbar">
        <h2>Your Ideas</h2>
        <button class="pink-fab" data-action="new" aria-label="Add new idea">＋</button>
      </div>

      <div id="ideasList" class="ideas-list"></div>

    </section>
  </template>

  <template id="rowTemplate">
    <article class="idea-row soft-card">
      <div class="thumb"><img alt=""><span>No sketch</span></div>
      <div><h3></h3><p></p><small></small></div>
    </article>
  </template>

  <template id="editorTemplate">
    <section class="screen editor-screen">
      <div class="toolbar editor-toolbar">
        <button class="text-button" data-action="back">‹ BACK</button>
        <h2 id="editorTitle">IDEA</h2>
        <button class="text-button danger-text" data-action="delete">DELETE</button>
      </div>

      <form id="ideaForm" class="editor-stack">
        <section class="soft-card sketch-editor">
          <div class="panel-title-row">
            <h3>1. Sketch</h3>
            <span id="editorSketchCount">0 / 0</span>
          </div>

          <div class="canvas-wrap">
            <canvas id="sketchCanvas"></canvas>
          </div>
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

          <div class="draw-tools icon-tools" aria-label="Sketch controls">
            <button type="button" class="icon-button" data-action="prevSketch" title="Previous sketch">‹</button>
            <button type="button" class="icon-button" data-action="nextSketch" title="Next sketch">›</button>
            <button type="button" class="icon-button" data-action="newSketch" title="New sketch">＋</button>
            <button type="button" class="icon-button" data-action="undoSketch" title="Undo">↶</button>
            <button type="button" class="icon-button" data-action="markMain" title="Mark main">★</button>
            <button type="button" class="icon-button danger-icon" data-action="removeSketch" title="Remove">×</button>
          </div>
          <button type="button" class="photo-sketch-btn" data-action="photoSketch" title="Take photo" aria-label="Take photo">📷</button>

        </section>

        <label><span>2. Idea name</span><input id="ideaName" placeholder="Give your idea a name..."></label>
        <label><span>3. Description</span><textarea id="description" rows="5" placeholder="Describe your idea..."></textarea></label>
        <label><span>4. Materials</span><textarea id="materials" rows="4" placeholder="e.g. 18ct Rose Gold, Diamonds..."></textarea></label>
        <label><span>5. Stage</span><select id="stage"><option>Idea</option><option>Test Piece Done</option><option>In Production</option></select></label>
      </form>
    </section>
  </template>

  <footer class="app-version">v0.15 pink</footer>
  <script src="app.js?v=015"></script>
</body>
</html>
